<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Week 6 board · Raul’s NFL Survivor Dashboard</title>
  <meta name="description" content="Private 2026 NFL Survivor Pool tracker.">
  <script>
    (function () {
      try { localStorage.removeItem("raul-survivor-theme"); } catch (error) {}
      var override = null;
      var media = window.matchMedia("(prefers-color-scheme: dark)");
      function apply() {
        var dark = override === "dark" || (override !== "light" && media.matches);
        var root = document.documentElement;
        root.setAttribute("data-theme", dark ? "dark" : "light");
        root.setAttribute("data-theme-choice", override || "system");
        root.style.colorScheme = dark ? "dark" : "light";
        var toggle = document.querySelector(".theme-switch");
        if (toggle) toggle.setAttribute("aria-checked", dark ? "true" : "false");
      }
      apply();
      media.addEventListener("change", function () {
        override = null;
        apply();
      });
      document.addEventListener("DOMContentLoaded", function () {
        var toggle = document.querySelector(".theme-switch");
        if (!toggle) return;
        apply();
        toggle.addEventListener("click", function () {
          override = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
          apply();
        });
      });
    })();
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="shortcut icon" href="favicon.svg">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <header class="topbar">
    <div class="topbar-inner">
      <p class="topbar-kicker">2026 NFL Survivor</p>
      <p class="topbar-title">Raul’s Survivor</p>
      <button type="button" class="theme-switch" role="switch" aria-checked="false" aria-label="Dark mode">
    <svg class="theme-icon theme-sun" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4" fill="currentColor"></circle>
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
      </g>
    </svg>
    <svg class="theme-icon theme-moon" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M15.5 3.1a8.5 8.5 0 1 0 5.4 12.8A7 7 0 0 1 15.5 3.1z"></path>
    </svg>
    <span class="theme-knob" aria-hidden="true"></span>
      </button>
    </div>
    <nav class="tabbar" aria-label="Sections">
      <div class="tabbar-pill" role="tablist">
        <a class="tab is-active" href="./#home" data-tab="home" aria-current="page">Home</a>
        <a class="tab" href="./#nfelo" data-tab="nfelo">NFELO</a>
        <a class="tab" href="./#other" data-tab="other">Other</a>
      </div>
    </nav>
  </header>
  <main class="shell board-page">
    <a class="back-link" href="./">‹ Back to Raul’s Survivor</a>
    <div class="section-head">
      <div>
        <h1 id="board-title" class="board-page-title">Week 6 confidence board</h1>
        <p class="hint">Tap an eligible projected winner to save your pick. It saves online for every device.</p>
      </div>
      <a class="external" href="https://www.nfeloapp.com/games/nfl-confidence-picks/" target="_blank" rel="noreferrer">View live NFELO board</a>
    </div>
    <p id="pick-error" class="alert" role="alert" hidden></p>
    <div id="confidence" class="panel board board-full">
      <p class="hint">Loading the board…</p>
    </div>
    <p class="footnote">Confidence board uses NFELO model probabilities.</p>
  </main>
  <div id="pick-modal" class="modal-root" hidden>
    <div class="modal-sheet lg-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-bar">
        <p class="eyebrow" id="modal-kicker">Week</p>
        <button type="button" class="modal-close" id="modal-close">Close</button>
      </div>
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
    </div>
  </div>
  <script src="glass.js"></script>
  <script src="app.js"></script>
</body>
</html>
